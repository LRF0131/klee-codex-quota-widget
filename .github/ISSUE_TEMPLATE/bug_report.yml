name: Bug report
description: Report a reproducible problem
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Never paste auth.json, access tokens, account IDs, or private session content."
  - type: input
    id: version
    attributes:
      label: Widget version
      placeholder: "1.2.0"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Windows and Codex environment
      description: Remove usernames, paths, tokens, and account identifiers.
